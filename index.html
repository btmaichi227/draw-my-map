<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Draw My Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column, phone-first. Home = setup card; Game = timer strip, map, then role tools below. */
:root{
  --paper:#EEF2EE; --surface:#FFFFFF; --ink:#16231E; --muted:#56655F; --line:#C5D0CA;
  --grass:#CFE2C3; --tree:#9CC28C; --water:#A8D2E5; --path:#F5ECD6; --floor:#E7ECF1; --hall:#D9E1E8; --wall:#2A3934;
  --bldg:#FFFFFF; --accent:#E9A51A; --accent-ink:#2A1C00; --accent-soft:#FBE7B8;
  --ok:#23835A; --ok-soft:#D4EEDF; --bad:#C1402B; --bad-soft:#F6D8D1;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111815; --surface:#18211D; --ink:#E4ECE7; --muted:#9BABA4; --line:#2E3B36;
  --grass:#22362A; --tree:#2F4D38; --water:#1D3C4B; --path:#3A3527; --floor:#1C252B; --hall:#25313A; --wall:#B9C7C1;
  --bldg:#1B2420; --accent:#F0B43A; --accent-ink:#1E1400; --accent-soft:#4A3A12;
  --ok:#5CC28F; --ok-soft:#173A29; --bad:#EE7A64; --bad-soft:#47201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111815; --surface:#18211D; --ink:#E4ECE7; --muted:#9BABA4; --line:#2E3B36;
  --grass:#22362A; --tree:#2F4D38; --water:#1D3C4B; --path:#3A3527; --floor:#1C252B; --hall:#25313A; --wall:#B9C7C1;
  --bldg:#1B2420; --accent:#F0B43A; --accent-ink:#1E1400; --accent-soft:#4A3A12;
  --ok:#5CC28F; --ok-soft:#173A29; --bad:#EE7A64; --bad-soft:#47201A; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:480px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Home */
.eyebrow{font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.title{font-size:clamp(44px,13vw,64px);font-weight:800;font-stretch:72%;line-height:.9;letter-spacing:-.01em;text-transform:uppercase;margin-top:8px}
.title span{display:inline-block;border-bottom:5px dashed var(--accent);padding-bottom:2px}
.lede{color:var(--muted);margin-top:12px;max-width:40ch}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;min-width:0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt b{font:700 17px/1.15 var(--display)}
.opt small{color:var(--muted);font-size:13px;line-height:1.3}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--accent-soft)}
.opt svg{width:100%;height:auto;border-radius:6px;margin-bottom:6px;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative;flex:1;min-width:56px;text-align:center;padding:10px 0;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;font:700 16px var(--display);font-variant-numeric:tabular-nums;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--ink);background:var(--accent-soft)}
.how{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px}
.how h2{font-size:18px;margin-bottom:8px}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how li::marker{font-family:var(--display);font-weight:700}
.go{width:100%;padding:16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:800 20px var(--display);letter-spacing:.02em}
.go:active{transform:translateY(1px)}

/* Game */
.bar{display:flex;align-items:center;gap:12px}
.back{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font:600 14px var(--display);flex:none}
.bar .who{min-width:0}
.bar h2{font-size:20px;line-height:1.1}
.role{font:600 13px/1.2 var(--display);color:var(--muted)}
.timer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.clock{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;font-stretch:90%;flex:1}
.timer button{border:1.5px solid var(--ink);background:var(--bldg);border-radius:8px;padding:8px 14px;font:700 15px var(--display)}
.timer .tstart{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.timer.up{border-color:var(--bad);background:var(--bad-soft)}
.timer.up .clock{color:var(--bad)}
.note{font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}

.map{position:relative;width:100%;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);background:var(--grass)}
.map.museum{background:var(--paper)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map svg.top{pointer-events:none}
.grass{fill:var(--grass)} .water{fill:var(--water)} .trees circle{fill:var(--tree)}
.paths{stroke:var(--path)} .bridge{fill:var(--path)} .rail{stroke:var(--ink);stroke-width:1.2;fill:none;opacity:.6}
.floor{fill:var(--floor);stroke:var(--wall);stroke-width:4}
.hall{fill:var(--hall);stroke:var(--wall);stroke-width:2}
.given{fill:var(--hall);stroke:var(--wall);stroke-width:1.5}
.thin{stroke:var(--wall);stroke-width:1;fill:none;opacity:.7}
.gap rect,.door{fill:var(--floor)}
.paperfill{fill:var(--paper)}
.lbl{font:600 10px var(--display);fill:var(--ink);opacity:.8}
.lbl.sm{font-size:9px}
.compass circle{fill:var(--bldg);stroke:var(--ink);stroke-width:1.2}
.compass path{fill:var(--ink)}
.compass text{font:800 9px var(--display);fill:var(--ink)}

.slot{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;padding:2px;
  background:var(--bldg);border:1.5px solid var(--ink);border-radius:3px;color:var(--ink);overflow:hidden;
  font:600 clamp(9px,2.75vw,12.5px)/1.08 var(--display);font-stretch:88%;overflow-wrap:anywhere}
.museum .slot{border-radius:0;border:2px solid var(--wall)}
button.slot{cursor:pointer}
.slot.filled{background:var(--accent-soft)}
.targeting button.slot:not(.filled){box-shadow:inset 0 0 0 2px var(--accent)}
.slot.ok{background:var(--ok-soft);border-color:var(--ok)}
.slot.bad{background:var(--bad-soft);border-color:var(--bad)}
.slot .was{text-decoration:line-through;opacity:.75;font-weight:500}
.slot .fix{color:var(--ok);font-weight:800}
.slot .tag{font-size:.82em;font-weight:500;opacity:.8}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:16px}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:var(--bldg);border-radius:999px;padding:8px 13px;font:600 15px/1.1 var(--display)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{font:700 14px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;padding:12px;border-radius:9px;border:1.5px solid var(--ink);background:var(--bldg);font:700 16px var(--display)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.confirm{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.score{display:flex;align-items:baseline;gap:12px}
.score strong{font:800 52px/1 var(--display);font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1.5px solid}
details.phr{background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
details.phr summary{padding:12px 14px;font:700 16px var(--display);cursor:pointer}
.phr .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;padding:0 14px 14px}
.phr h4{grid-column:1/-1;margin:8px 0 0;font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.phr p{font-size:14px;line-height:1.35}
.hint{min-height:1.4em;font-size:14px;color:var(--muted)}
@media (max-width:380px){.phr .cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const MAPS = {
  park: {
    name: "Riverside Park", kind: "Outdoor", W: 360, H: 480,
    landmarks: "Lake, Bridge, River, North gate, West gate, Main entrance",
    base: `
      <rect class="grass" width="360" height="480"/>
      <path class="water" d="M318 0 C306 90 328 160 316 240 C304 320 328 400 318 480 L360 480 L360 0 Z"/>
      <g class="paths" fill="none" stroke-width="14">
        <ellipse cx="150" cy="215" rx="72" ry="56"/>
        <path d="M150 480 V271 M150 159 V0 M78 215 H0 M222 215 H316"/>
      </g>
      <ellipse class="water" cx="150" cy="215" rx="50" ry="34"/>
      <rect class="bridge" x="306" y="206" width="54" height="18"/>
      <path class="rail" d="M306 206 H360 M306 224 H360"/>
      <g class="trees"><circle cx="60" cy="114" r="7"/><circle cx="96" cy="120" r="5"/><circle cx="205" cy="114" r="6"/><circle cx="104" cy="390" r="5"/><circle cx="24" cy="303" r="6"/><circle cx="212" cy="294" r="5"/><circle cx="268" cy="112" r="6"/><circle cx="290" cy="392" r="5"/></g>
      <text class="lbl" x="150" y="219" text-anchor="middle">Lake</text>
      <text class="lbl sm" x="161" y="11">North gate</text>
      <text class="lbl sm" x="4" y="204">West gate</text>
      <text class="lbl sm" x="333" y="200" text-anchor="middle">Bridge</text>
      <text class="lbl sm" x="161" y="474">Main entrance</text>
      <text class="lbl" transform="translate(343 330) rotate(-90)" text-anchor="middle">River</text>
      <g class="compass" transform="translate(278 64)"><circle r="15"/><path d="M0 -12 L4 0 L0 4 L-4 0Z"/><text y="-19" text-anchor="middle">N</text></g>`,
    top: "",
    slots: [
      {id:"p1", x:20, y:410, w:110, h:50, a:"Car park"},
      {id:"p2", x:168, y:410, w:64, h:50, a:"Visitor centre"},
      {id:"p3", x:40, y:320, w:90, h:48, a:"Toilets"},
      {id:"p4", x:168, y:320, w:70, h:48, a:"Playground"},
      {id:"p5", x:10, y:140, w:64, h:52, a:"Picnic area"},
      {id:"p6", x:10, y:238, w:64, h:52, a:null},
      {id:"p7", x:20, y:30, w:100, h:60, a:"Tennis courts"},
      {id:"p8", x:172, y:30, w:72, h:60, a:"Rose garden"},
      {id:"p9", x:232, y:140, w:70, h:50, a:null},
      {id:"p10", x:232, y:236, w:70, h:50, a:"Boathouse"},
      {id:"p11", x:246, y:310, w:58, h:58, a:"Bike hire"},
      {id:"p12", x:240, y:410, w:62, h:50, a:"Café"}
    ]
  },
  museum: {
    name: "City Museum", kind: "Indoor", W: 360, H: 510,
    landmarks: "Main hall, Entrance hall, Stairs, Lift, Main entrance",
    base: `
      <rect class="floor" x="8" y="12" width="344" height="452"/>
      <rect class="hall" x="128" y="130" width="104" height="160"/>
      <g class="gap"><rect x="125" y="200" width="6" height="20"/><rect x="229" y="200" width="6" height="20"/><rect x="170" y="127" width="20" height="6"/><rect x="170" y="287" width="20" height="6"/></g>
      <rect class="given" x="114" y="306" width="48" height="46"/>
      <path class="thin" d="M114 315 H162 M114 324 H162 M114 333 H162 M114 342 H162"/>
      <rect class="given" x="198" y="306" width="48" height="46"/>
      <path class="thin" d="M198 306 L246 352 M246 306 L198 352"/>
      <rect class="hall" x="128" y="376" width="104" height="88"/>
      <g class="gap"><rect x="170" y="373" width="20" height="6"/></g>
      <rect class="paperfill" x="160" y="459" width="40" height="10"/>
      <text class="lbl" x="180" y="214" text-anchor="middle">Main hall</text>
      <text class="lbl" x="180" y="424" text-anchor="middle">Entrance hall</text>
      <text class="lbl sm" x="138" y="368" text-anchor="middle">Stairs</text>
      <text class="lbl sm" x="222" y="368" text-anchor="middle">Lift</text>
      <text class="lbl" x="180" y="488" text-anchor="middle">Main entrance</text>
      <g class="compass" transform="translate(330 490)"><circle r="12"/><path d="M0 -10 L3.5 0 L0 3 L-3.5 0Z"/><text y="-15" text-anchor="middle">N</text></g>`,
    top: `
      <g class="doorset">
        <rect class="door" x="103" y="49" width="5" height="18"/><rect class="door" x="103" y="133" width="5" height="18"/><rect class="door" x="103" y="217" width="5" height="18"/><rect class="door" x="103" y="301" width="5" height="18"/><rect class="door" x="103" y="399" width="5" height="18"/>
        <rect class="door" x="252" y="49" width="5" height="18"/><rect class="door" x="252" y="133" width="5" height="18"/><rect class="door" x="252" y="217" width="5" height="18"/><rect class="door" x="252" y="301" width="5" height="18"/><rect class="door" x="252" y="399" width="5" height="18"/>
        <rect class="door" x="134" y="89" width="18" height="5"/><rect class="door" x="208" y="89" width="18" height="5"/>
      </g>`,
    slots: [
      {id:"m1", x:12, y:16, w:94, h:84, a:"Art gallery"},
      {id:"m2", x:12, y:100, w:94, h:84, a:null},
      {id:"m3", x:12, y:184, w:94, h:84, a:"Lecture room"},
      {id:"m4", x:12, y:268, w:94, h:84, a:"Cloakroom"},
      {id:"m5", x:12, y:352, w:94, h:112, a:"Ticket office"},
      {id:"m6", x:254, y:16, w:94, h:84, a:"Dinosaur gallery"},
      {id:"m7", x:254, y:100, w:94, h:84, a:"Children's room"},
      {id:"m8", x:254, y:184, w:94, h:84, a:null},
      {id:"m9", x:254, y:268, w:94, h:84, a:"Toilets"},
      {id:"m10", x:254, y:352, w:94, h:112, a:"Gift shop"},
      {id:"m11", x:106, y:16, w:74, h:76, a:"Ancient Egypt room"},
      {id:"m12", x:180, y:16, w:74, h:76, a:"Café"}
    ]
  }
};

const S = { screen:"home", map:"park", role:"A", minutes:5, place:{}, sel:null, checked:false, asking:false, round:1 };
const T = { left:300, endAt:0, running:false, id:null, up:false, lock:null };
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labelsOf = m => MAPS[m].slots.filter(s => s.a).map(s => s.a).sort((a,b) => a.localeCompare(b));
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

/* ---------- Home ---------- */
function home(){
  stopTimer(true);
  const parkThumb = `<svg viewBox="0 0 120 56" aria-hidden="true"><rect width="120" height="56" class="grass"/><path class="water" d="M100 0 C94 20 106 36 100 56 H120 V0Z"/><ellipse cx="50" cy="28" rx="16" ry="10" class="water"/><rect x="12" y="8" width="16" height="10" rx="2" style="fill:var(--bldg);stroke:var(--ink)"/><rect x="72" y="36" width="16" height="10" rx="2" style="fill:var(--bldg);stroke:var(--ink)"/></svg>`;
  const musThumb = `<svg viewBox="0 0 120 56" aria-hidden="true"><rect width="120" height="56" class="floor" style="stroke-width:2"/><rect x="4" y="4" width="28" height="16" style="fill:var(--bldg);stroke:var(--wall)"/><rect x="4" y="20" width="28" height="16" style="fill:var(--bldg);stroke:var(--wall)"/><rect x="4" y="36" width="28" height="16" style="fill:var(--bldg);stroke:var(--wall)"/><rect x="88" y="4" width="28" height="16" style="fill:var(--bldg);stroke:var(--wall)"/><rect x="88" y="20" width="28" height="16" style="fill:var(--bldg);stroke:var(--wall)"/><rect x="88" y="36" width="28" height="16" style="fill:var(--bldg);stroke:var(--wall)"/><rect x="46" y="16" width="28" height="24" class="hall"/></svg>`;
  app.innerHTML = `
    <header>
      <p class="eyebrow">IELTS Listening · Map labelling</p>
      <h1 class="title">Draw <span>My Map</span></h1>
      <p class="lede">${S.round > 1 ? "<b>Round 2.</b> Swap roles and try the other map." : "One partner describes. One partner listens and puts 10 places on a blank map."}</p>
    </header>
    <fieldset>
      <legend>1 · Choose a map</legend>
      <div class="opts">
        <label class="opt"><input type="radio" name="map" id="map-park" value="park" ${S.map==="park"?"checked":""}>${parkThumb}<b>Riverside Park</b><small>Outdoor · 10 places</small></label>
        <label class="opt"><input type="radio" name="map" id="map-museum" value="museum" ${S.map==="museum"?"checked":""}>${musThumb}<b>City Museum</b><small>Indoor · 10 places</small></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>2 · Choose your role</legend>
      <div class="opts">
        <label class="opt"><input type="radio" name="role" id="role-a" value="A" ${S.role==="A"?"checked":""}><b>Student A</b><small>Describer. You see the full map.</small></label>
        <label class="opt"><input type="radio" name="role" id="role-b" value="B" ${S.role==="B"?"checked":""}><b>Student B</b><small>Listener. You place the names.</small></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>3 · Time limit</legend>
      <div class="seg">${[3,4,5,6].map(m => `<label><input type="radio" name="min" id="min-${m}" value="${m}" ${S.minutes===m?"checked":""}>${m} min</label>`).join("")}</div>
    </fieldset>
    <section class="how">
      <h2>How to play</h2>
      <ol>
        <li>Partners choose the <b>same map</b> and <b>different roles</b>. Keep your screens hidden.</li>
        <li>Student A starts at the main entrance and describes where each place is. Use the compass and the landmarks.</li>
        <li>Student B listens and taps a name, then taps a building. B can ask questions, but A cannot point.</li>
        <li>When time is up, B taps <b>Check answers</b>. Then swap roles and play the other map.</li>
      </ol>
    </section>
    <button class="go" id="start">Start</button>`;
  app.querySelectorAll('input[name="map"]').forEach(i => i.onchange = () => S.map = i.value);
  app.querySelectorAll('input[name="role"]').forEach(i => i.onchange = () => S.role = i.value);
  app.querySelectorAll('input[name="min"]').forEach(i => i.onchange = () => S.minutes = +i.value);
  document.getElementById("start").onclick = () => {
    S.place = {}; S.sel = null; S.checked = false; S.asking = false;
    T.left = S.minutes * 60; T.up = false; T.running = false;
    S.screen = "game"; game(); window.scrollTo(0,0);
  };
}

/* ---------- Map ---------- */
function mapHTML(mode){
  const M = MAPS[S.map];
  const pos = s => `left:${s.x/M.W*100}%;top:${s.y/M.H*100}%;width:${s.w/M.W*100}%;height:${s.h/M.H*100}%`;
  const slots = M.slots.map(s => {
    if (mode === "A") return `<div class="slot" style="${pos(s)}">${s.a ? esc(s.a) : ""}</div>`;
    const placed = S.place[s.id];
    if (S.checked){
      if (s.a && placed === s.a) return `<div class="slot ok" style="${pos(s)}">${esc(s.a)}</div>`;
      if (!s.a && !placed) return `<div class="slot" style="${pos(s)}"></div>`;
      const was = placed ? `<span class="was">${esc(placed)}</span>` : `<span class="tag">missed</span>`;
      const fix = s.a ? `<span class="fix">${esc(s.a)}</span>` : `<span class="tag">empty</span>`;
      return `<div class="slot bad" style="${pos(s)}">${was}${fix}</div>`;
    }
    return `<button class="slot ${placed?"filled":""}" data-slot="${s.id}" style="${pos(s)}" aria-label="${placed?"Building: "+esc(placed)+". Tap to remove":"Empty building"}">${placed?esc(placed):""}</button>`;
  }).join("");
  return `<div class="map ${S.map} ${mode==="B"&&S.sel&&!S.checked?"targeting":""}" style="aspect-ratio:${M.W}/${M.H}">
    <svg viewBox="0 0 ${M.W} ${M.H}" aria-hidden="true">${M.base}</svg>
    ${slots}
    <svg class="top" viewBox="0 0 ${M.W} ${M.H}" aria-hidden="true">${M.top}</svg>
  </div>`;
}

/* ---------- Game ---------- */
function game(){
  const M = MAPS[S.map];
  const isA = S.role === "A";
  const head = `
    <div class="bar">
      <button class="back" id="back">← Menu</button>
      <div class="who"><h2>${M.name}</h2><p class="role">${isA ? "Student A · Describer" : "Student B · Listener"} · ${M.kind}</p></div>
    </div>
    <div class="timer ${T.up?"up":""}" id="timer">
      <span class="clock" id="clock">${T.up ? "Time's up" : fmt(T.left)}</span>
      <button class="tstart" id="tgo">${T.running ? "Pause" : "Start"}</button>
      <button id="treset" aria-label="Reset timer">Reset</button>
    </div>`;
  let body;
  if (isA){
    body = `
      <p class="note"><b>Don't show your screen.</b> Your partner can only see: ${M.landmarks}, the compass and 12 empty buildings. Two buildings have no name.</p>
      ${mapHTML("A")}
      <details class="phr" id="phr">
        <summary>Useful phrases</summary>
        <div class="cols">
          <h4>Position</h4>
          <p>next to / beside / adjoining</p><p>opposite / across from</p>
          <p>between … and …</p><p>behind / in front of</p>
          <p>in the north-west corner</p><p>to the east of …</p>
          <p>at the end of the path</p><p>the second room on your left</p>
          <h4>Directions</h4>
          <p>go straight ahead</p><p>turn left / right</p>
          <p>go past …</p><p>follow the path until …</p>
          <p>cross the bridge</p><p>go through the doors</p>
          <h4>Checking</h4>
          <p>Have you got that?</p><p>Can you see the …?</p>
        </div>
      </details>`;
  } else {
    const all = labelsOf(S.map);
    const used = new Set(Object.values(S.place));
    const left = all.filter(l => !used.has(l));
    const n = used.size;
    if (S.checked){
      const score = MAPS[S.map].slots.filter(s => s.a && S.place[s.id] === s.a).length;
      const msg = score === 10 ? "Perfect map! Great teamwork." : score >= 8 ? "Great describing and listening." : score >= 5 ? "Good work. Look at the red buildings together." : "Talk about the red buildings. Which landmarks would help?";
      body = `
        ${mapHTML("B")}
        <section class="panel">
          <div class="score"><strong>${score}/10</strong><span>${msg}</span></div>
          <div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Correct</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Wrong: your answer crossed out, correct answer in green</span></div>
          <div class="row">
            <button class="btn" id="again">Try again</button>
            <button class="btn primary" id="next">Next round: swap roles</button>
          </div>
        </section>`;
    } else {
      body = `
        <p class="note">Tap a name, then tap a building. Tap a building again to take the name off.</p>
        ${mapHTML("B")}
        <section class="panel">
          <div class="row" style="justify-content:space-between;align-items:baseline"><h3>Places</h3><span class="count">${n}/10 placed</span></div>
          <div class="tray">${left.length ? left.map(l => `<button class="chip" data-chip="${esc(l)}" aria-pressed="${S.sel===l}">${esc(l)}</button>`).join("") : `<p class="note">All 10 names are on the map.</p>`}</div>
          <p class="hint" id="hint" aria-live="polite">${S.sel ? `Now tap a building for <b>${esc(S.sel)}</b>.` : ""}</p>
          ${S.asking ? `<div class="confirm"><p>You placed ${n} of 10 names. Check anyway?</p><div class="row"><button class="btn" id="cancel">Keep going</button><button class="btn primary" id="sure">Check now</button></div></div>`
            : `<button class="btn primary" id="check">Check answers</button>`}
        </section>`;
    }
  }
  const open = document.getElementById("phr")?.open;
  app.innerHTML = head + body;
  if (open) document.getElementById("phr").open = true;
  wire();
}

function wire(){
  document.getElementById("back").onclick = () => { S.screen = "home"; home(); window.scrollTo(0,0); };
  document.getElementById("tgo").onclick = () => T.running ? pauseTimer() : startTimer();
  document.getElementById("treset").onclick = () => { stopTimer(true); T.left = S.minutes*60; T.up = false; game(); };
  app.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => { S.sel = S.sel === b.dataset.chip ? null : b.dataset.chip; game(); });
  app.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => {
    const id = b.dataset.slot, cur = S.place[id];
    if (S.sel){ S.place[id] = S.sel; S.sel = null; }
    else if (cur){ delete S.place[id]; S.sel = cur; }
    else { const h = document.getElementById("hint"); if (h) h.textContent = "Tap a name first."; return; }
    game();
  });
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on("check", () => { if (Object.keys(S.place).length < 10){ S.asking = true; game(); } else doCheck(); });
  on("cancel", () => { S.asking = false; game(); });
  on("sure", doCheck);
  on("again", () => { S.place = {}; S.sel = null; S.checked = false; S.asking = false; game(); });
  on("next", () => { S.map = S.map === "park" ? "museum" : "park"; S.role = "A"; S.round = 2; S.screen = "home"; home(); window.scrollTo(0,0); });
}
function doCheck(){ S.checked = true; S.asking = false; S.sel = null; pauseTimer(); game(); }

/* ---------- Timer ---------- */
function paintClock(){
  const c = document.getElementById("clock"), box = document.getElementById("timer"), g = document.getElementById("tgo");
  if (!c) return;
  c.textContent = T.up ? "Time's up" : fmt(T.left);
  box.classList.toggle("up", T.up);
  g.textContent = T.running ? "Pause" : "Start";
}
async function startTimer(){
  if (T.left <= 0) return;
  T.running = true; T.endAt = Date.now() + T.left*1000;
  clearInterval(T.id);
  T.id = setInterval(() => {
    T.left = Math.max(0, Math.ceil((T.endAt - Date.now())/1000));
    if (T.left === 0){ stopTimer(false); T.up = true; try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){} }
    paintClock();
  }, 250);
  paintClock();
  try{ if ("wakeLock" in navigator && !T.lock) T.lock = await navigator.wakeLock.request("screen"); }catch(e){ T.lock = null; }
}
function pauseTimer(){ clearInterval(T.id); T.running = false; paintClock(); }
function stopTimer(release){
  clearInterval(T.id); T.running = false;
  if (release && T.lock){ try{ T.lock.release(); }catch(e){} T.lock = null; }
}

home();
</script>

</body></html>
